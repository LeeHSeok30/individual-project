<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolling score lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#182f32;font:17px/1.45 system-ui,sans-serif}main{max-width:950px;margin:30px auto;padding:12px 35px}h1{font-size:37px;margin:8px 0 16px}h2{font-size:18px;margin:19px 0 6px}select,button{font:inherit;padding:5px;color:inherit;background:white;border:1px solid #9fafac;border-radius:4px}label{margin-right:16px}.row{display:flex;align-items:end;gap:9px;height:145px;border-bottom:1px solid #92aaa5;padding:0 10px}.column{text-align:center;flex:1;color:#6c7977}.bar{background:#c7cfcb;width:100%;height:var(--h)}.in .bar{background:#309384}.leading .bar{background:#cb592f}.column b{font-size:19px}.legend{font-size:14px;color:#325b55}.queue{font:19px ui-monospace,monospace;color:#075d55}input[type=range]{width:min(47vw,385px);vertical-align:middle}#stats{border-top:1px solid #bdcbc7;padding-top:10px}output{font-weight:bold}</style>
<main><h1>Rolling score lab</h1>
<label>Record <select id="record"></select></label><label>On a tie <select id="tie"><option>Keep newest</option><option>Keep oldest</option></select></label>
<h2 id="head"></h2><div class="row" id="bars"></div><p class="legend">Gray: outside the active window · Teal: in window · Orange: leading candidate</p>
<label>Game <input id="step" type="range" min="1"><output id="game"></output></label>
<h2>Deque from front to back</h2><div class="queue" id="queue"></div>
<p id="stats"></p><p id="verified"></p></main>
<script>
const data=[{"name": "Six games", "x": [28, 14, 20, 17, 12, 16], "k": 5, "answers": [28, 20], "modes": [[{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1], "maximum": null}, {"c": 2, "p": 1, "queue": [0, 2], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 2, 3], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 2, 3, 4], "maximum": 28}, {"c": 2, "p": 1, "queue": [2, 3, 5], "maximum": 20}], [{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1], "maximum": null}, {"c": 2, "p": 1, "queue": [0, 2], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 2, 3], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 2, 3, 4], "maximum": 28}, {"c": 2, "p": 1, "queue": [2, 3, 5], "maximum": 20}]]}, {"name": "Equal scores", "x": [18, 18, 18, 18, 18, 18, 18, 18, 18], "k": 5, "answers": [18, 18, 18, 18, 18], "modes": [[{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 1, "queue": [1], "maximum": null}, {"c": 1, "p": 1, "queue": [2], "maximum": null}, {"c": 1, "p": 1, "queue": [3], "maximum": null}, {"c": 1, "p": 1, "queue": [4], "maximum": 18}, {"c": 1, "p": 1, "queue": [5], "maximum": 18}, {"c": 1, "p": 1, "queue": [6], "maximum": 18}, {"c": 1, "p": 1, "queue": [7], "maximum": 18}, {"c": 1, "p": 1, "queue": [8], "maximum": 18}], [{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4], "maximum": 18}, {"c": 1, "p": 0, "queue": [1, 2, 3, 4, 5], "maximum": 18}, {"c": 1, "p": 0, "queue": [2, 3, 4, 5, 6], "maximum": 18}, {"c": 1, "p": 0, "queue": [3, 4, 5, 6, 7], "maximum": 18}, {"c": 1, "p": 0, "queue": [4, 5, 6, 7, 8], "maximum": 18}]]}, {"name": "One expensive update", "x": [9, 8, 7, 6, 5, 4, 3, 2, 1, 10], "k": 9, "answers": [9, 10], "modes": [[{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6, 7], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6, 7, 8], "maximum": 9}, {"c": 8, "p": 8, "queue": [9], "maximum": 10}], [{"c": 0, "p": 0, "queue": [0], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6, 7], "maximum": null}, {"c": 1, "p": 0, "queue": [0, 1, 2, 3, 4, 5, 6, 7, 8], "maximum": 9}, {"c": 8, "p": 8, "queue": [9], "maximum": 10}]]}];
const at=id=>document.getElementById(id);
const select=at('record'), tie=at('tie'),step=at('step');
for(const d of data)select.add(new Option(d.name));
function reset(){step.max=data[select.selectedIndex].x.length;step.value=step.max;draw()}
function draw(){
 const d=data[select.selectedIndex],i=Number(step.value)-1,row=d.modes[tie.selectedIndex][i];
 at('game').textContent=String(i+1);at('head').textContent='Points per game · window '+d.k;
 at('bars').replaceChildren();
 d.x.forEach((v,j)=>{const cell=document.createElement('div');cell.className='column'+(j>i-d.k&&j<=i?' in':'')+(j===row.queue[0]?' leading':'');
 const val=document.createElement('b');val.textContent=v;const bar=document.createElement('div');bar.className='bar';bar.style.setProperty('--h',(88*v/Math.max(...d.x))+'px');
 cell.append(val,bar);const lbl=document.createElement('small');lbl.textContent='G'+(j+1);cell.append(lbl);at('bars').append(cell)});
 at('queue').textContent=row.queue.map(j=>'G'+(j+1)+' ('+d.x[j]+')').join('   →   ');
 at('stats').textContent='Window maximum: '+(row.maximum??'warming up')+'   ·   Score comparisons this update: '+row.c+'   ·   Back removals: '+row.p;
 at('verified').textContent='All three Python methods agree. Complete output: ['+d.answers.join(', ')+']';
}
select.onchange=reset;tie.onchange=draw;step.oninput=draw;reset();</script></html>
